global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: movierec-api
    metrics_path: /metrics
    static_configs:
      # Scrape the fixed container ports; BACKEND_PORT is the gateway's host binding.
      - targets: ["gateway:8080"]
        labels: { service: gateway }
      - targets: ["auth:8082"]
        labels: { service: auth }
      - targets: ["movies:8083"]
        labels: { service: movies }
      - targets: ["recommendations:8084"]
        labels: { service: recommendations }
  - job_name: llama-embedding
    metrics_path: /metrics
    static_configs:
      - targets: ["llama-embedding:8080"]
  - job_name: llama-generation
    metrics_path: /metrics
    static_configs:
      - targets: ["llama-generation:8080"]
