global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: movierec-api
    metrics_path: /metrics
    static_configs:
      # Scrape the backend's fixed container port; BACKEND_PORT is its host binding.
      - targets: ["backend:8080"]
  - job_name: llama-embedding
    metrics_path: /metrics
    static_configs:
      - targets: ["llama-embedding:8080"]
  - job_name: llama-generation
    metrics_path: /metrics
    static_configs:
      - targets: ["llama-generation:8080"]
