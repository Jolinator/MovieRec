stages:
  - validate
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "CI/CD_testing"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "CI/CD_testing"'

backend_validation:
  stage: validate
  image: golang:1.27.1
  script:
    - ./ci-cd/validate-backend.sh

frontend_validation:
  stage: validate
  image: node:22-alpine
  script:
    - ./ci-cd/validate-frontend.sh

frontend_tests:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run test:run

backend_unit_tests:
  stage: test
  image: golang:1.27.1
  script:
    - ./ci-cd/test-backend-unit.sh
  artifacts:
    when: always
    paths:
      - testing/backend/unit/coverage.out

backend_tests:
  stage: test
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BACKEND_HOST: docker
  before_script:
    - apk add --no-cache apache2-utils bash curl python3 py3-pip
    - pip install --break-system-packages -r testing/backend/DockerTests/requirements.txt
    - ./ci-cd/prepare-backend-integration.sh
    - |
      for attempt in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      docker info >/dev/null 2>&1 || {
        echo "Docker-in-Docker did not become ready within 60 seconds; check the runner's Docker executor and privileged setting."
        exit 1
      }
  script:
    - ./ci-cd/test-backend.sh
  artifacts:
    when: always
    paths:
      - testing/backend/reports/
    expire_in: 1 week

apachebench_stress:
  stage: test
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BACKEND_HOST: docker
  before_script:
    - apk add --no-cache apache2-utils bash curl python3
    - ./ci-cd/prepare-backend-integration.sh
    - |
      for attempt in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      docker info >/dev/null 2>&1 || {
        echo "Docker-in-Docker did not become ready within 60 seconds; check the runner's Docker executor and privileged setting."
        exit 1
      }
  script:
    - ./ci-cd/run-apachebench-stress.sh

docker_images:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BACKEND_IMAGE_PREFIX: "$CI_REGISTRY/$CI_PROJECT_PATH"
    BACKEND_IMAGE_TAG: "$CI_COMMIT_SHA"
    FRONTEND_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH/frontend:$CI_COMMIT_SHA"
  before_script:
    - |
      for attempt in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      docker info >/dev/null 2>&1 || {
        echo "Docker-in-Docker did not become ready within 60 seconds; check the runner's Docker executor and privileged setting."
        exit 1
      }
  script:
    - ./ci-cd/build-images.sh

update_app:
  stage: deploy
  dependencies: []
  image: google/cloud-sdk:slim
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHA"
    GCP_REGION: "europe-west1"
    GCP_ZONE: "europe-west1-b"
    MOVIEREC_RESOURCE_NAME: "movierec"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ansible make curl
    - |
      case "$(dpkg --print-architecture)" in
        amd64) docker_arch=x86_64 ;;
        arm64) docker_arch=aarch64 ;;
        *) echo "Unsupported architecture for Docker CLI: $(dpkg --print-architecture)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://download.docker.com/linux/static/stable/${docker_arch}/docker-27.5.1.tgz" -o /tmp/docker.tgz
      tar --extract --file /tmp/docker.tgz --strip-components 1 --directory /usr/local/bin/ --no-same-owner docker/docker
      rm /tmp/docker.tgz
    - export PATH="/usr/local/bin:$PATH"
    - command -v docker
    - docker --version
    - test -n "$TF_VAR_project_id" || { echo 'Set protected CI/CD variable TF_VAR_project_id'; exit 2; }
    - test -n "$GCP_SERVICE_ACCOUNT_KEY" || { echo 'Set GCP_SERVICE_ACCOUNT_KEY as a protected GitLab file variable'; exit 2; }
    - export GOOGLE_APPLICATION_CREDENTIALS="$GCP_SERVICE_ACCOUNT_KEY"
    - gcloud auth activate-service-account --key-file="$GCP_SERVICE_ACCOUNT_KEY" --project="$TF_VAR_project_id"
    - export GCP_PROJECT_ID="$TF_VAR_project_id"
    - |
      docker_ready=0
      for attempt in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          docker_ready=1
          break
        fi
        sleep 1
      done
      if [ "$docker_ready" -ne 1 ]; then
        echo "Docker-in-Docker did not become ready within 60 seconds; check the runner's Docker executor and privileged setting."
        docker info
        exit 1
      fi
  script:
    - make update-app IMAGE_TAG="$IMAGE_TAG" PUBLIC_HOST="$PUBLIC_HOST"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  allow_failure: false
  environment:
    name: production
