services:
  auth-postgres:
    image: postgres:16
    entrypoint: ["/usr/local/bin/tls-entrypoint.sh"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tmp/server.crt", "-c", "ssl_key_file=/tmp/server.key"]
    env_file:
      - ./secrets/auth.env
    ports:
      - "${AUTH_POSTGRES_PORT:?Set AUTH_POSTGRES_PORT in secrets/ports.env}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./secrets/tls:/run/secrets/postgres-tls:ro
      - ./database/tls-entrypoint.sh:/usr/local/bin/tls-entrypoint.sh:ro
      - ./database/migrations/auth:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  movies-postgres:
    image: pgvector/pgvector:pg16
    entrypoint: ["/usr/local/bin/tls-entrypoint.sh"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tmp/server.crt", "-c", "ssl_key_file=/tmp/server.key"]
    env_file:
      - ./secrets/movies.env
    ports:
      - "${MOVIES_POSTGRES_PORT:?Set MOVIES_POSTGRES_PORT in secrets/ports.env}:5432"
    volumes:
      - movies-postgres-data:/var/lib/postgresql/data
      - ./secrets/tls:/run/secrets/postgres-tls:ro
      - ./database/tls-entrypoint.sh:/usr/local/bin/tls-entrypoint.sh:ro
      - ./database/migrations/movies:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendations-postgres:
    image: postgres:16
    entrypoint: ["/usr/local/bin/tls-entrypoint.sh"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tmp/server.crt", "-c", "ssl_key_file=/tmp/server.key"]
    env_file:
      - ./secrets/recommendations.env
    ports:
      - "${RECOMMENDATIONS_POSTGRES_PORT:?Set RECOMMENDATIONS_POSTGRES_PORT in secrets/ports.env}:5432"
    volumes:
      - recommendations-postgres-data:/var/lib/postgresql/data
      - ./secrets/tls:/run/secrets/postgres-tls:ro
      - ./database/tls-entrypoint.sh:/usr/local/bin/tls-entrypoint.sh:ro
      - ./database/migrations/recommendations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BACKEND_PORT: "8080"
    env_file:
      - ./secrets/auth.env
      - ./secrets/movies.env
      - ./secrets/recommendations.env
      - ./secrets/tmdb.env
      - ./secrets/ports.env
    ports:
      - "${BACKEND_PORT:?Set BACKEND_PORT in secrets/ports.env}:8080"
    volumes:
      - ./secrets/auth.env:/app/secrets/auth.env:ro
      - ./secrets/movies.env:/app/secrets/movies.env:ro
      - ./secrets/recommendations.env:/app/secrets/recommendations.env:ro
      - ./secrets/jwt-private.pem:/app/secrets/jwt-private.pem:ro
      - ./secrets/jwt-public.pem:/app/secrets/jwt-public.pem:ro
      - ./secrets/tmdb.env:/app/secrets/tmdb.env:ro
      - ./secrets/ports.env:/app/secrets/ports.env:ro
    environment:
      BACKEND_PORT: "8080"
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt-public.pem
      EMBEDDING_URL: http://llama-embedding:8080
      GENERATION_URL: http://llama-generation:8080
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-bge-small-en-v1.5-q8_0}"
      GENERATION_MODEL: "${GENERATION_MODEL:-Qwen3-0.6B-Q4_K_M}"

  model-downloader:
    image: curlimages/curl:8.12.1
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/download-models.sh"]
    environment:
      EMBEDDING_MODEL_URL: "https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-q8_0.gguf"
      EMBEDDING_MODEL_SHA256: "ec38e8da142596baa913124ae50550de284b6916bf59577ef2f0cb9660c2f514"
      GENERATION_MODEL_URL: "https://huggingface.co/lm-kit/qwen-3-0.6b-instruct-gguf/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"
      GENERATION_MODEL_SHA256: "2b1a7ed56061ad1275847412f61e8e009ada37ef865dccc25747dcc76eea9811"
    volumes:
      - model-data:/models
      - ./scripts/download-models.sh:/scripts/download-models.sh:ro

  llama-embedding:
    image: ghcr.io/ggml-org/llama.cpp:server-v0.4.1
    command: ["--host", "0.0.0.0", "--port", "8080", "--model", "/models/embedding.gguf", "--embedding", "--log-verbosity", "2"]
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    volumes:
      - model-data:/models:ro

  llama-generation:
    image: ghcr.io/ggml-org/llama.cpp:server-v0.4.1
    command: ["--host", "0.0.0.0", "--port", "8080", "--model", "/models/qwen.gguf", "--ctx-size", "4096", "--log-verbosity", "2"]
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    volumes:
      - model-data:/models:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:?Set BACKEND_PORT in secrets/ports.env}/"
    ports:
      - "${FRONTEND_PORT:?Set FRONTEND_PORT in secrets/ports.env}:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in secrets/ports.env}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "${GRAFANA_PORT:?Set GRAFANA_PORT in secrets/ports.env}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  prometheus-data:
  grafana-data:
  auth-postgres-data:
  movies-postgres-data:
  recommendations-postgres-data:
  model-data:
