apiVersion: v1
kind: Namespace
metadata:
  name: movierec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-tls-entrypoint
  namespace: movierec
data:
  tls-entrypoint.sh: |
    #!/bin/sh
    set -eu
    cp /run/secrets/postgres-tls/server.crt /tmp/server.crt
    cp /run/secrets/postgres-tls/server.key /tmp/server.key
    chown postgres:postgres /tmp/server.crt /tmp/server.key
    chmod 600 /tmp/server.key
    exec /usr/local/bin/docker-entrypoint.sh "$@"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: movierec
spec:
  clusterIP: None
  selector: { app: auth-postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgres
  namespace: movierec
spec:
  serviceName: auth-postgres
  replicas: 1
  selector:
    matchLabels: { app: auth-postgres }
  template:
    metadata:
      labels: { app: auth-postgres }
    spec:
      nodeSelector:
        movierec.io/role: database
      containers:
        - name: postgres
          image: postgres:16
          command: ["/usr/local/bin/tls-entrypoint.sh"]
          args: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tmp/server.crt", "-c", "ssl_key_file=/tmp/server.key"]
          envFrom:
            - secretRef: { name: auth-config }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: migrations, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: tls, mountPath: /run/secrets/postgres-tls, readOnly: true }
            - { name: entrypoint, mountPath: /usr/local/bin/tls-entrypoint.sh, subPath: tls-entrypoint.sh, readOnly: true }
      volumes:
        - name: migrations
          configMap: { name: auth-migrations }
        - name: tls
          secret: { secretName: postgres-tls, defaultMode: 0440 }
        - name: entrypoint
          configMap: { name: postgres-tls-entrypoint, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 5Gi } }
---
