apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-embedding
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: llama-embedding }
  template:
    metadata:
      labels: { app: llama-embedding }
    spec:
      nodeSelector:
        movierec.io/role: model
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-v0.4.1
          args: ["--host", "0.0.0.0", "--port", "8080", "--model", "/models/embedding.gguf", "--embedding", "--metrics", "--log-verbosity", "2"]
          ports: [{ name: http, containerPort: 8080 }]
          # Model loading time varies; readiness can fail without restarting
          # the container, so don't impose a finite startup deadline here.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-data }
---
apiVersion: v1
kind: Service
metadata:
  name: llama-embedding
  namespace: movierec
spec:
  selector: { app: llama-embedding }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-generation
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: llama-generation }
  template:
    metadata:
      labels: { app: llama-generation }
    spec:
      nodeSelector:
        movierec.io/role: model
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-v0.4.1
          args: ["--host", "0.0.0.0", "--port", "8080", "--model", "/models/qwen.gguf", "--ctx-size", "4096", "--metrics", "--log-verbosity", "2"]
          ports: [{ name: http, containerPort: 8080 }]
          # Model loading time varies; readiness can fail without restarting
          # the container, so don't impose a finite startup deadline here.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-data }
---
apiVersion: v1
kind: Service
metadata:
  name: llama-generation
  namespace: movierec
spec:
  selector: { app: llama-generation }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      nodeSelector:
        movierec.io/role: app
      containers:
        - name: frontend
          image: ${REGISTRY}/frontend:${IMAGE_TAG}
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: movierec
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movierec
  namespace: movierec
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${PUBLIC_HOST}"]
      secretName: movierec-web-tls
  rules:
    - host: "${PUBLIC_HOST}"
      http:
        paths:
          - path: /movieAPI
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      nodeSelector:
        movierec.io/role: app
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: movierec
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: movierec
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      nodeSelector:
        movierec.io/role: app
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: grafana-config, key: admin-password } } }
            - { name: GF_SERVER_ROOT_URL, value: "http://localhost:3000/" }
            - { name: GF_SECURITY_CSRF_ADDITIONAL_HEADERS, value: "X-Forwarded-Host" }
            - { name: GF_LIVE_ALLOWED_ORIGINS, value: "https://*-cs-*.cloudshell.dev,http://localhost:*,http://127.0.0.1:*" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: dashboards, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: datasources
          configMap: { name: grafana-datasources }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: movierec
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: movierec
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
# Each database accepts connections only from the service that owns it, and
# the model services only from the recommendations service plus Prometheus for
# metrics. Kubernetes Service DNS still works across all three nodes; these
# policies constrain pod ingress after traffic crosses the K3s overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-database-ingress
  namespace: movierec
spec:
  podSelector:
    matchLabels: { app: auth-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: auth }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: movies-database-ingress
  namespace: movierec
spec:
  podSelector:
    matchLabels: { app: movies-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: movies }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recommendations-database-ingress
  namespace: movierec
spec:
  podSelector:
    matchLabels: { app: recommendations-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: recommendations }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recommendations-only-models
  namespace: movierec
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [llama-embedding, llama-generation]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [recommendations, prometheus]
      ports:
        - { protocol: TCP, port: 8080 }
