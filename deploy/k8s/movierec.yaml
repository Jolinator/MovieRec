apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ${REGISTRY}/backend:${IMAGE_TAG}
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: auth-config }
            - secretRef: { name: movies-config }
            - secretRef: { name: recommendations-config }
            - secretRef: { name: tmdb-config }
          env:
            - { name: BACKEND_PORT, value: "8080" }
            - { name: AUTH_DB_HOST, value: auth-postgres }
            - { name: MOVIES_DB_HOST, value: movies-postgres }
            - { name: RECOMMENDATIONS_DB_HOST, value: recommendations-postgres }
            - { name: AUTH_DB_SSLMODE, value: require }
            - { name: MOVIES_DB_SSLMODE, value: require }
            - { name: RECOMMENDATIONS_DB_SSLMODE, value: require }
            - { name: JWT_PRIVATE_KEY_PATH, value: /app/secrets/jwt-private.pem }
            - { name: JWT_PUBLIC_KEY_PATH, value: /app/secrets/jwt-public.pem }
          readinessProbe:
            httpGet: { path: /movieAPI/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /movieAPI/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - { name: jwt, mountPath: /app/secrets, readOnly: true }
      volumes:
        - name: jwt
          secret: { secretName: jwt-keys, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: movierec
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ${REGISTRY}/frontend:${IMAGE_TAG}
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: movierec
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movierec
  namespace: movierec
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${PUBLIC_HOST}"]
      secretName: movierec-web-tls
  rules:
    - host: "${PUBLIC_HOST}"
      http:
        paths:
          - path: /movieAPI
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: movierec
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: movierec-api
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: movierec
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: movierec
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: movierec
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: grafana-config, key: admin-password } } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: movierec
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: movierec
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
